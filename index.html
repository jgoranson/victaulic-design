const EX_INFO_HTML = `
<p><b>Short answer:</b> for offsets and loops, minimum and maximum temperatures are enough. For gapped couplings and expansion joints, the installation temperature matters, because it decides how the joint is set the day it goes in.</p>
<table class="sch engtable" style="max-width:none"><thead><tr><th>Method</th><th>Install temp needed?</th><th>Why</th></tr></thead><tbody>
<tr><td>Offset (2 flex couplings after the 90)</td><td><b>No</b> \u2014 use max \u2212 min</td><td>The coupling pair deflects either way from straight. Max \u2212 min is always equal to or larger than the real movement, so it\u2019s conservative.</td></tr>
<tr><td>Flexible expansion loop</td><td><b>No</b> \u2014 use max \u2212 min</td><td>Same reason.</td></tr>
<tr><td>Gapped couplings in a straight run</td><td><b>Yes</b></td><td>26.02: hot systems go in at maximum pipe-end gap, cold systems go in butted, mixed systems are gapped in between. Set it wrong and the run runs out of travel one way. Use the gap chart in the working.</td></tr>
<tr><td>Inline expansion joint</td><td><b>Yes</b></td><td>It has to be preset to the temperature at installation. Follow the specific joint submittal.</td></tr>
</tbody></table>
<p><b>The catch:</b> if the pipe is installed outside the operating range, that temperature becomes the extreme. Chilled water roughed in during a hot August is the classic case. Use the highest and lowest temperatures the pipe will ever see, including the day it\u2019s installed.</p>
<h3>Victaulic 26.02 and the coupling submittal</h3>
<p>26.02 defines \u0394T as usually the difference between the ambient temperature at installation and the minimum and/or maximum operating temperature, and asks the designer to apply a safety factor. The submittal design values are net: no further reduction is needed. Deflection is per coupling from centerline, so one value works in both directions for offsets. Full linear movement and full angular deflection can\u2019t be used at the same coupling at the same time, so don\u2019t count on the same couplings for both gapping and offset deflection.</p>
<h3>BC Plumbing Code</h3>
<p><b>2.3.3.9 Expansion and contraction</b> is a performance requirement: piping must be installed to allow for expansion and contraction. It doesn\u2019t prescribe a method, a \u0394T definition or an installation temperature, so the method is left to the designer. <b>2.6.1.11</b> covers pressure from thermal expansion of water (expansion tanks), not pipe movement.</p>
<h3>How BC engineers handle it</h3>
<p>Mechanical engineers follow ASME B31 practice. Building services piping falls under B31.9, with Technical Safety BC oversight for registered pressure piping. Pipe stress is checked over the full minimum-to-maximum range; installation temperature only affects where things physically sit (gaps, presets, anchor reactions). Division 22/23 specs usually put the movement design on the engineer, and make the contractor responsible for installing and presetting to the manufacturer\u2019s instructions.</p>
<h3>What to tell contractors</h3>
<p>Offsets and loops: you don\u2019t need the install temperature; max \u2212 min gives a safe answer. Gapped couplings or expansion joints: know the temperature when you install, and set the gap or preset to suit it.</p>
<p class="hint">References: <a href="${EX_SUB_2602.url}" target="_blank" rel="noopener">Victaulic 26.02 Rev D</a>; British Columbia Plumbing Code, Articles 2.3.3.9 and 2.6.1.11; ASME B31.9 Building Services Piping. Confirm against the engineer\u2019s specifications and current code edition.</p>`;
